<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medical Report Explainer | MediAI</title>
  <meta name="description" content="MediAI: an AI-powered medical assistant that explains health information in simple language. Educational use only.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230a7b78'/%3E%3Cpath d='M6 17h5l3-7 4 12 3-5h5' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="report" data-disclaimer="true">
<main id="content" class="page">
  <header class="page-head"><h1 data-i18n="nav_report">Report Explainer</h1><p data-i18n="report_sub"></p></header>
  <form id="report-form" class="card" novalidate>
    <span class="label" id="upload-label" data-i18n="upload_label">Upload report</span>
    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-labelledby="upload-label">
      <span data-icon="upload"></span>
      <div data-i18n="upload_hint"></div>
      <input type="file" id="file" accept=".jpg,.jpeg,.png,.webp,.pdf,.txt" hidden>
    </div>
    <div class="preview" id="preview" hidden></div>
    <label class="label" for="text" data-i18n="paste_label">Or paste report text</label>
    <textarea id="text" rows="7" maxlength="30000" data-i18n-placeholder="paste_ph"></textarea>
    <label class="label" for="question" data-i18n="question_label">Your question (optional)</label>
    <input id="question" type="text" maxlength="500" data-i18n-placeholder="question_ph">
    <div class="btn-row"><button class="btn btn-primary" id="submit" type="submit"><span data-i18n="analyze_report">Analyze report</span></button></div>
  </form>
  <div id="results" aria-live="polite"></div>
</main>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/report.js"></script>
</body>
</html>
